<h2>一、二叉树的定义与存储</h2>

<h3>完全二叉树的下标关系（数组存储，下标从 1 开始）</h3>
<table style="width:100%; border-collapse:collapse; font-size:0.9rem; margin:0.5rem 0;">

// ========== 幻灯片 3：原理推导 - 非递归遍历 ==========
slides.push(`
<h2>二、非递归遍历 — 栈模拟详解</h2>

<h3>前序遍历（非递归）核心思路</h3>
<div class="code-block">
<span class="cm">// 根→左→右。栈后进先出 → 先压右孩子，再压左孩子</span>
<span class="tp">vector</span>&lt;<span class="tp">int</span>&gt; <span class="fn">preorderIterative</span>(<span class="tp">TreeNode</span>* root) {
    <span class="tp">vector</span>&lt;<span class="tp">int</span>&gt; res; <span class="kw">if</span> (!root) <span class="kw">return</span> res;
    <span class="tp">stack</span>&lt;<span class="tp">TreeNode</span>*&gt; st; st.<span class="fn">push</span>(root);
    <span class="kw">while</span> (!st.<span class="fn">empty</span>()) {
        <span class="tp">TreeNode</span>* cur = st.<span class="fn">top</span>(); st.<span class="fn">pop</span>();
        res.<span class="fn">push_back</span>(cur->val);           <span class="cm">// 访问</span>
        <span class="kw">if</span> (cur->right) st.<span class="fn">push</span>(cur->right); <span class="cm">// 先右</span>
        <span class="kw">if</span> (cur->left)  st.<span class="fn">push</span>(cur->left);  <span class="cm">// 后左</span>
    }
    <span class="kw">return</span> res;
}
</div>

<h3>中序遍历（非递归）核心思路</h3>
<div class="code-block">
<span class="cm">// 一路向左入栈 → 弹出访问 → 转向右子树</span>
<span class="tp">vector</span>&lt;<span class="tp">int</span>&gt; <span class="fn">inorderIterative</span>(<span class="tp">TreeNode</span>* root) {
    <span class="tp">vector</span>&lt;<span class="tp">int</span>&gt; res;
    <span class="tp">stack</span>&lt;<span class="tp">TreeNode</span>*&gt; st; <span class="tp">TreeNode</span>* cur = root;
    <span class="kw">while</span> (cur || !st.<span class="fn">empty</span>()) {
        <span class="kw">while</span> (cur) { st.<span class="fn">push</span>(cur); cur = cur->left; }
        cur = st.<span class="fn">top</span>(); st.<span class="fn">pop</span>();
        res.<span class="fn">push_back</span>(cur->val);
        cur = cur->right;
    }
    <span class="kw">return</span> res;
}
</div>

<div class="highlight-box">
<span class="dot">●</span> <strong>后序遍历非递归（双栈法）</strong>：利用「根-右-左」的逆序 = 「左-右-根」。第一个栈模拟「根右左」的前序变体，结果存第二个栈，最后反转输出。
</div>
`);

// ========== 幻灯片 4：代码模板 ==========
slides.push(`
<h2>三、递归遍历 + 二叉树重建 标准模板</h2>

<h3>递归遍历（简洁版）</h3>
<div class="code-block">
<span class="kw">void</span> <span class="fn">preorder</span>(<span class="tp">TreeNode</span>* root) {
    <span class="kw">if</span> (!root) <span class="kw">return</span>;
    cout &lt;&lt; root->val &lt;&lt; <span class="st">' '</span>;
    <span class="fn">preorder</span>(root->left);
    <span class="fn">preorder</span>(root->right);
}
<span class="kw">void</span> <span class="fn">inorder</span>(<span class="tp">TreeNode</span>* root) {
    <span class="kw">if</span> (!root) <span class="kw">return</span>;
    <span class="fn">inorder</span>(root->left);
    cout &lt;&lt; root->val &lt;&lt; <span class="st">' '</span>;
    <span class="fn">inorder</span>(root->right);
}
<span class="kw">void</span> <span class="fn">postorder</span>(<span class="tp">TreeNode</span>* root) {
    <span class="kw">if</span> (!root) <span class="kw">return</span>;
    <span class="fn">postorder</span>(root->left);
    <span class="fn">postorder</span>(root->right);
    cout &lt;&lt; root->val &lt;&lt; <span class="st">' '</span>;
}
</div>

<h3>前序 + 中序 → 重建二叉树</h3>
<div class="code-block">
<span class="tp">unordered_map</span>&lt;<span class="tp">int</span>,<span class="tp">int</span>&gt; inMap;
<span class="tp">TreeNode</span>* <span class="fn">build</span>(<span class="tp">vector</span>&lt;<span class="tp">int</span>&gt;& pre, <span class="tp">int</span> pL, <span class="tp">int</span> pR,
                 <span class="tp">vector</span>&lt;<span class="tp">int</span>&gt;& in,  <span class="tp">int</span> iL, <span class="tp">int</span> iR) {
    <span class="kw">if</span> (pL > pR) <span class="kw">return</span> <span class="kw">nullptr</span>;
    <span class="tp">int</span> rv = pre[pL], pos = inMap[rv], sz = pos - iL;
    <span class="tp">TreeNode</span>* root = <span class="kw">new</span> <span class="tp">TreeNode</span>(rv);
    root->left  = <span class="fn">build</span>(pre, pL+<span class="nu">1</span>, pL+sz, in, iL, pos-<span class="nu">1</span>);
    root->right = <span class="fn">build</span>(pre, pL+sz+<span class="nu">1</span>, pR, in, pos+<span class="nu">1</span>, iR);
    <span class="kw">return</span> root;
}
<span class="cm">// 注意：仅前序+后序无法唯一确定二叉树！</span>
</div>
`);

<h2>四、真题精练</h2>

<h3>真题一：二叉树重建与遍历</h3>
<p>给定前序和中序遍历序列（n ≤ 10⁵，值互不相同），输出后序遍历序列。</p>
<div class="code-block">
<span class="cm">// 核心思想：前序第一个是根，在中序中定位根，递归建树同时输出后序</span>
<span class="tp">int</span> pre[MAXN], in[MAXN], pos_map[MAXN];

<span class="kw">void</span> <span class="fn">build_and_post</span>(<span class="tp">int</span> pL, <span class="tp">int</span> pR, <span class="tp">int</span> iL, <span class="tp">int</span> iR) {
    <span class="kw">if</span> (pL > pR) <span class="kw">return</span>;
    <span class="tp">int</span> rootVal = pre[pL];
    <span class="tp">int</span> rootPos = pos_map[rootVal];
    <span class="tp">int</span> leftSize = rootPos - iL;
    <span class="fn">build_and_post</span>(pL+<span class="nu">1</span>, pL+leftSize, iL, rootPos-<span class="nu">1</span>);
    <span class="fn">build_and_post</span>(pL+leftSize+<span class="nu">1</span>, pR, rootPos+<span class="nu">1</span>, iR);
    cout &lt;&lt; rootVal &lt;&lt; <span class="st">' '</span>;  <span class="cm">// 后序：左右根</span>
}
</div>

<h3>真题二：树的子结构判定</h3>
<p>判断 B 是否是 A 的子树（n, m ≤ 10⁴）。<br>
<span class="dot">●</span> <strong>关键技巧</strong>：将树序列化（前序遍历，空节点用 -1 表示），问题变为「判断 B 的序列化结果是否是 A 的序列化结果的子串」，使用 <strong>KMP 算法</strong> O(n+m) 完成匹配。</p>

<div class="highlight-box">
  <strong>复杂度：</strong>建树 O(n+m) + 序列化 O(n+m) + KMP O(n+m) → 总 O(n+m)
</div>
`);

`);

function renderSlide() {
    document.getElementById('slideContent').innerHTML = slides[currentSlide];
    document.getElementById('slideNum').textContent = (currentSlide + 1) + ' / ' + slides.length;
    document.getElementById('prevBtn').disabled = currentSlide === 0;
    document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
}

function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }
function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); } }

// 键盘导航
document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault(); nextSlide();
    }
});

// 初始渲染
renderSlide();
</script>
