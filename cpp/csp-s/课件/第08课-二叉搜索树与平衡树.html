// ========== 幻灯片 4：代码模板 - AVL 与 Treap ==========
slides.push(`
<h2>三、AVL 插入 &amp; Treap 插入 标准模板</h2>

<h3>AVL 插入（BST 插入 + 回溯平衡）</h3>
<div class="code-block">
<span class="tp">AVLNode</span>* <span class="fn">avlInsert</span>(<span class="tp">AVLNode</span>* root, <span class="tp">int</span> key) {
    <span class="kw">if</span> (!root) <span class="kw">return</span> <span class="kw">new</span> <span class="tp">AVLNode</span>(key);          <span class="cm">// 1.BST插入</span>
    <span class="kw">if</span> (key &lt; root->val) root->left = <span class="fn">avlInsert</span>(root->left, key);
    <span class="kw">else if</span> (key > root->val) root->right = <span class="fn">avlInsert</span>(root->right, key);
    <span class="kw">else return</span> root;
    <span class="fn">updateHeight</span>(root);                   <span class="cm">// 2.更新高度</span>
    <span class="tp">int</span> bf = <span class="fn">getBF</span>(root);                   <span class="cm">// 3.计算平衡因子</span>
    <span class="kw">if</span> (bf > <span class="nu">1</span> && key &lt; root->left->val)   <span class="kw">return</span> <span class="fn">rotateRight</span>(root); <span class="cm">// LL</span>
    <span class="kw">if</span> (bf &lt; -<span class="nu">1</span> && key > root->right->val)  <span class="kw">return</span> <span class="fn">rotateLeft</span>(root);  <span class="cm">// RR</span>
    <span class="kw">if</span> (bf > <span class="nu">1</span> && key > root->left->val)    <span class="cm">// LR</span>
        { root->left = <span class="fn">rotateLeft</span>(root->left); <span class="kw">return</span> <span class="fn">rotateRight</span>(root); }
    <span class="kw">if</span> (bf &lt; -<span class="nu">1</span> && key &lt; root->right->val)   <span class="cm">// RL</span>
        { root->right = <span class="fn">rotateRight</span>(root->right); <span class="kw">return</span> <span class="fn">rotateLeft</span>(root); }
    <span class="kw">return</span> root;
}
</div>

<h3>Treap 插入（BST 插入 + 旋转维护大根堆）</h3>
<div class="code-block">
<span class="tp">TreapNode</span>* <span class="fn">treapInsert</span>(<span class="tp">TreapNode</span>* root, <span class="tp">int</span> key) {
    <span class="kw">if</span> (!root) <span class="kw">return</span> <span class="kw">new</span> <span class="tp">TreapNode</span>(key);  <span class="cm">// 随机 priority</span>
    <span class="kw">if</span> (key &lt; root->key) {
        root->left = <span class="fn">treapInsert</span>(root->left, key);
        <span class="kw">if</span> (root->left->priority > root->priority)
            root = <span class="fn">rotateRight</span>(root);  <span class="cm">// 左孩子priority大→右旋上浮</span>
    } <span class="kw">else if</span> (key > root->key) {
        root->right = <span class="fn">treapInsert</span>(root->right, key);
        <span class="kw">if</span> (root->right->priority > root->priority)
            root = <span class="fn">rotateLeft</span>(root);   <span class="cm">// 右孩子priority大→左旋上浮</span>
    }
    <span class="kw">return</span> root;
}
</div>
`);

<h2>四、真题精练</h2>

<h3>真题一：[CSP-S 真题变体] 普通平衡树（Treap 实现）</h3>
<p>支持 6 种操作（n ≤ 10⁵）：插入 x、删除 x、查询 rank、查询第 k 小、前驱、后继。</p>
<div class="highlight-box">
  <strong>解题关键</strong>：Treap 节点维护 <code>size</code> 用于排名，<code>cnt</code> 处理重复元素。使用 <code>mt19937</code> 生成高质量的随机优先级。
</div>

<h3>真题二：[CSP-S 模拟] 第 K 大数查询（AVL 实现）</h3>
<p>支持插入、删除、查询第 k 大数（Q ≤ 2×10⁵，|x| ≤ 10⁹）。<br>
第 k 大 = 升序排名第 (size - k + 1) 小的数。</p>

<div class="code-block">
<span class="cm">// 查询第 k 小（排名）—— AVL / Treap 通用模板</span>
<span class="tp">int</span> <span class="fn">kthSmallest</span>(<span class="tp">AVLNode</span>* root, <span class="tp">int</span> k) {
    <span class="tp">int</span> leftSize = <span class="fn">getSize</span>(root->left);
    <span class="kw">if</span> (k &lt;= leftSize) <span class="kw">return</span> <span class="fn">kthSmallest</span>(root->left, k);
    <span class="kw">if</span> (k == leftSize + <span class="nu">1</span>) <span class="kw">return</span> root->val;
    <span class="kw">return</span> <span class="fn">kthSmallest</span>(root->right, k - leftSize - <span class="nu">1</span>);
}
<span class="cm">// 第 k 大 = kthSmallest(root, totalSize - k + 1)</span>
</div>

<div class="highlight-box" style="margin-top:0.5rem;">
  <strong>复杂度分析</strong>：每次操作 O(log n)，总 O(n log n)。空间 O(n)。Treap 期望平衡，AVL 严格平衡，均能通过 10⁵ 级数据。
</div>
`);

slides.push(`
<h2>五、易错点与优化技巧</h2>

<table style="width:100%; border-collapse:collapse; font-size:0.88rem;">
  <tr style="background:#0f3460; color:#f5c542;">
    <td style="padding:8px; border:1px solid #30363d;">#</td>
    <td style="padding:8px; border:1px solid #30363d;">易错点</td>

  <tr style="background:#16213e;">
    <td style="padding:5px 8px; border:1px solid #30363d; text-align:center;">1</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">AVL 旋转后高度更新顺序错误</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">先 update(原根下层)，再 update(新根上层)</td>
  </tr>
  <tr style="background:#16213e;">

    <td style="padding:5px 8px; border:1px solid #30363d;">Treap 删除时旋转方向错误</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">priority<strong>小</strong>的孩子旋转上来，使待删节点下沉</td>
  </tr>
  <tr style="background:#16213e;">
    <td style="padding:5px 8px; border:1px solid #30363d; text-align:center;">3</td>
    <td style="padding:5px 8px; border:1px solid #30363d;"><code>rand()</code> 范围太小（32767）</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">使用 <code>mt19937</code> 或 <code>rand()*RAND_MAX+rand()</code></td>
  </tr>
  <tr style="background:#16213e;">
    <td style="padding:5px 8px; border:1px solid #30363d; text-align:center;">4</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">BST 删除后忘 return</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">删除函数每一分支都必须正确返回新根节点</td>
  </tr>
  <tr style="background:#16213e;">
    <td style="padding:5px 8px; border:1px solid #30363d; text-align:center;">5</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">AVL 删除只用一次旋转</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">AVL 删除可能导致沿路径多次旋转，必须递归回溯平衡</td>
  </tr>
  <tr style="background:#16213e;">
    <td style="padding:5px 8px; border:1px solid #30363d; text-align:center;">6</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">Treap split 边界条件错误</td>
    <td style="padding:5px 8px; border:1px solid #30363d;">按 k 分裂：root->key ≤ k 归左树；root->key > k 归右树</td>
  </tr>
</table>

<h3 style="margin-top:1rem;">💡 Split + Merge 实现无旋 Treap</h3>
<div class="code-block">
<span class="cm">// 插入：split 出 ≤k 和 >k，合并 (合并(左, 新节点), 右)</span>
<span class="kw">void</span> <span class="fn">split</span>(<span class="tp">TreapNode</span>* root, <span class="tp">int</span> k, <span class="tp">TreapNode</span>*& L, <span class="tp">TreapNode</span>*& R) {
    <span class="kw">if</span> (!root) { L = R = <span class="kw">nullptr</span>; <span class="kw">return</span>; }
    <span class="kw">if</span> (root->key &lt;= k) { L = root; <span class="fn">split</span>(root->right, k, L->right, R); }
    <span class="kw">else</span> { R = root; <span class="fn">split</span>(root->left, k, L, R->left); }
}
<span class="tp">TreapNode</span>* <span class="fn">merge</span>(<span class="tp">TreapNode</span>* L, <span class="tp">TreapNode</span>* R) {
    <span class="kw">if</span> (!L || !R) <span class="kw">return</span> L ? L : R;
    <span class="kw">if</span> (L->priority > R->priority) { L->right = <span class="fn">merge</span>(L->right, R); <span class="kw">return</span> L; }
    <span class="kw">else</span> { R->left = <span class="fn">merge</span>(L, R->left); <span class="kw">return</span> R; }
}
</div>
`);

      <li>随机 priority 保证期望平衡</li>
      <li>插入：BST+旋转维护堆</li>
      <li>删除：旋转下沉再删</li>
      <li>Split/Merge 实现区间操作</li>

    <h3 style="color:#53d8fb;">竞赛建议</h3>

`);

function renderSlide() {
    document.getElementById('slideContent').innerHTML = slides[currentSlide];
    document.getElementById('slideNum').textContent = (currentSlide + 1) + ' / ' + slides.length;
    document.getElementById('prevBtn').disabled = currentSlide === 0;
    document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
}

function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }
function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); } }

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault(); nextSlide();
    }
});

renderSlide();
</script>
